name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-integration:
    name: NC ${{ matrix.nextcloud-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: ["34", "35"]
    services:
      nextcloud:
        image: nextcloud:${{ matrix.nextcloud-version }}
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin
        ports:
          - 8080:80
        options: >-
          --health-cmd "curl -f http://localhost/status.php || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
      # The Mail account sends through smtp4dev and reads from Dovecot. smtp4dev's own IMAP server has
      # no MOVE, no folders and drops \Flagged and keywords, so it can't back the move/flag/tag tools.
      smtp4dev:
        image: rnwood/smtp4dev:latest
        env:
          ServerOptions__BasePath: /smtp4dev
        ports:
          - 9080:80
      dovecot:
        image: dovecot/dovecot:2.4.5
        env:
          USER_PASSWORD: test
        ports:
          - 9143:31143
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Nextcloud
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['installed'] else 1)" 2>/dev/null; then
              echo "Nextcloud is ready"
              break
            fi
            echo "Waiting... ($i)"
            sleep 3
          done

      - name: Configure Nextcloud for testing
        run: |
          NC_CONTAINER=${{ job.services.nextcloud.id }}
          OCC="docker exec $NC_CONTAINER su -s /bin/bash www-data -c"
          $OCC "php occ config:system:set ratelimit.protection.enabled --value=false --type=boolean"
          $OCC "php occ config:system:set auth.bruteforce.protection.enabled --value=false --type=boolean"
          $OCC "php occ config:system:set loglevel --value=2 --type=integer"
          # An app-password session never counts as password-confirmed, so user create/delete and app
          # enable/disable only pass for exempted IPs. Test requests reach the container from the network gateway.
          NC_GATEWAY=$(docker inspect $NC_CONTAINER --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')
          $OCC "php occ config:system:set allowed_no_password_confirmation_ranges 0 --value=$NC_GATEWAY/32"
          # The federated share tests share with users on the same server. It tells the recipient to reach it
          # at the address the tests use, so it must answer on port 8080 inside the container too.
          $OCC "php occ config:system:set allow_local_remote_servers --value=true --type=boolean"
          docker exec $NC_CONTAINER bash -c 'echo "Listen 8080" >> /etc/apache2/ports.conf && sed -i "s/<VirtualHost \*:80>/<VirtualHost *:80 *:8080>/" /etc/apache2/sites-enabled/000-default.conf && apache2ctl -k graceful'
          $OCC "php occ app:install spreed" || echo "spreed already installed"
          $OCC "php occ app:install announcementcenter" || echo "announcementcenter already installed"
          $OCC "php occ app:install collectives" || echo "collectives already installed"
          $OCC "php occ app:install mail"
          $OCC "php occ app:install forms" || echo "forms already installed"
          $OCC "php occ app:install cospend" || echo "cospend already installed"
          $OCC "php occ app:enable circles" || echo "circles enable failed (may not be shipped)"
          # Dovecot refuses plaintext logins, and its image ships a self-signed certificate for STARTTLS.
          $OCC "php occ config:system:set app.mail.verify-tls-peer --value=false --type=boolean"
          SMTP4DEV_IP=$(docker inspect ${{ job.services.smtp4dev.id }} --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          DOVECOT_IP=$(docker inspect ${{ job.services.dovecot.id }} --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "smtp4dev IP: $SMTP4DEV_IP, dovecot IP: $DOVECOT_IP"
          $OCC "php occ mail:account:create admin 'Test Mail' test@localhost $DOVECOT_IP 31143 tls test test $SMTP4DEV_IP 25 none test test"
          $OCC "php occ mail:account:sync 1"
          APP_PASS=$($OCC "php occ user:auth-tokens:add admin" | grep -oP '[A-Za-z0-9]{72}' | head -1)
          if [ -z "$APP_PASS" ]; then echo "::error::Failed to generate app password"; exit 1; fi
          echo "::add-mask::$APP_PASS"
          echo "NC_APP_PASSWORD=$APP_PASS" >> "$GITHUB_ENV"

      - name: Seed pagination test data
        run: python scripts/seed_pagination_data.py http://localhost:8080 admin "$NC_APP_PASSWORD"

      - name: Run integration tests
        env:
          NEXTCLOUD_URL: http://localhost:8080
          NEXTCLOUD_USER: admin
          NEXTCLOUD_PASSWORD: ${{ env.NC_APP_PASSWORD }}
          NEXTCLOUD_MCP_APP_PASSWORD: "true"
          SMTP4DEV_HOST: localhost
          SMTP4DEV_HTTP_PORT: "9080"
          MAIL_IMAP_HOST: localhost
          MAIL_IMAP_PORT: "9143"
          MAIL_IMAP_USER: test
          MAIL_IMAP_PASSWORD: test
          MAIL_RECIPIENT: test@localhost
          NC_CONTAINER: ${{ job.services.nextcloud.id }}
          MAIL_ACCOUNT_ID: "1"
        run: pytest tests/integration/ -v -m integration --ignore=tests/integration/test_session_cache.py --cov=nc_mcp_server --cov-report=xml:coverage-integration.xml

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: coverage-integration.xml
          flags: integration,nc${{ matrix.nextcloud-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show Nextcloud errors on failure
        if: failure()
        run: |
          docker exec ${{ job.services.nextcloud.id }} cat /var/www/html/data/nextcloud.log 2>/dev/null | python scripts/nextcloud_errors.py || echo "No logs found"

  test-session-cache:
    name: Session cache (NC ${{ matrix.nextcloud-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: ["34", "35"]
    services:
      nextcloud:
        image: nextcloud:${{ matrix.nextcloud-version }}
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin
        ports:
          - 8080:80
        options: >-
          --health-cmd "curl -f http://localhost/status.php || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Nextcloud
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['installed'] else 1)" 2>/dev/null; then
              echo "Nextcloud is ready"
              break
            fi
            echo "Waiting... ($i)"
            sleep 3
          done

      - name: Configure Nextcloud for testing
        run: |
          NC_CONTAINER=${{ job.services.nextcloud.id }}
          docker exec $NC_CONTAINER su -s /bin/bash www-data -c "php occ config:system:set ratelimit.protection.enabled --value=false --type=boolean"
          docker exec $NC_CONTAINER su -s /bin/bash www-data -c "php occ config:system:set auth.bruteforce.protection.enabled --value=false --type=boolean"

      - name: Run session cache tests (regular password)
        env:
          NEXTCLOUD_URL: http://localhost:8080
          NEXTCLOUD_USER: admin
          NEXTCLOUD_PASSWORD: admin
          NC_CONTAINER: ${{ job.services.nextcloud.id }}
        run: pytest tests/integration/test_session_cache.py -v -m integration --cov=nc_mcp_server --cov-report=xml:coverage-session-cache.xml

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: coverage-session-cache.xml
          flags: session-cache
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show Nextcloud errors on failure
        if: failure()
        run: |
          docker exec ${{ job.services.nextcloud.id }} cat /var/www/html/data/nextcloud.log 2>/dev/null | python scripts/nextcloud_errors.py || echo "No logs found"

  test-user-permissions:
    name: User permissions (NC ${{ matrix.nextcloud-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud-version: ["34", "35"]
    services:
      nextcloud:
        image: nextcloud:${{ matrix.nextcloud-version }}
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin
        ports:
          - 8080:80
        options: >-
          --health-cmd "curl -f http://localhost/status.php || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Nextcloud
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['installed'] else 1)" 2>/dev/null; then
              echo "Nextcloud is ready"
              break
            fi
            echo "Waiting... ($i)"
            sleep 3
          done

      - name: Configure Nextcloud for testing
        run: |
          NC_CONTAINER=${{ job.services.nextcloud.id }}
          docker exec $NC_CONTAINER su -s /bin/bash www-data -c "php occ config:system:set ratelimit.protection.enabled --value=false --type=boolean"
          docker exec $NC_CONTAINER su -s /bin/bash www-data -c "php occ config:system:set auth.bruteforce.protection.enabled --value=false --type=boolean"
          docker exec $NC_CONTAINER su -s /bin/bash www-data -c "php occ app:install spreed" || echo "spreed already installed"

      - name: Warm up OCS API
        run: |
          for i in $(seq 1 10); do
            if curl -sf -u admin:admin -H "OCS-APIRequest: true" http://localhost:8080/ocs/v2.php/cloud/user > /dev/null 2>&1; then
              echo "OCS API is ready"
              break
            fi
            echo "Waiting for OCS API... ($i)"
            sleep 3
          done

      - name: Run user permission tests
        env:
          NEXTCLOUD_URL: http://localhost:8080
          NEXTCLOUD_USER: admin
          NEXTCLOUD_PASSWORD: admin
        run: pytest tests/integration/test_user_permissions.py -v -m integration --cov=nc_mcp_server --cov-report=xml:coverage-user-perms.xml

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: coverage-user-perms.xml
          flags: user-permissions
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show Nextcloud errors on failure
        if: failure()
        run: |
          docker exec ${{ job.services.nextcloud.id }} cat /var/www/html/data/nextcloud.log 2>/dev/null | python scripts/nextcloud_errors.py || echo "No logs found"
